[package]
edition = "2024"
license = "Apache-2.0"
name = "pegainfer-core"
version = "0.1.0"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
colored = { workspace = true }
cudarc = { workspace = true, optional = true }
fastrace = { workspace = true }
fastrace-opentelemetry = { workspace = true }
half = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
logforth = { workspace = true }
memmap2 = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
pegainfer-frontend = { workspace = true }
pegainfer-kernels = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["cuda"]
cuda = ["dep:cudarc", "pegainfer-kernels/cuda"]
rocm = ["pegainfer-kernels/rocm"]
kernel-call-trace = []

[lints]
workspace = true

[[test]]
name = "weight_loader_gpu"
required-features = ["cuda"]
