[package]
edition = "2024"
license = "Apache-2.0"
name = "pegainfer-core"
version = "0.1.0"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
colored = { workspace = true }
cudarc = { workspace = true }
fastrace = { workspace = true }
fastrace-opentelemetry = { workspace = true }
half = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
logforth = { workspace = true }
memmap2 = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
pegainfer-frontend = { workspace = true }
pegainfer-kernels = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
safetensors = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[features]
default = []
kernel-call-trace = []
# Gated DeltaNet decode ops. Their kernels are Qwen3.5's (`csrc/qwen35/…`), which
# both the Qwen3.5 and the Qwen3.8-Flash-Next lines build; the flag names the
# kernel set, not the model line.
qwen35 = ["pegainfer-kernels/qwen35"]

[lints]
workspace = true
