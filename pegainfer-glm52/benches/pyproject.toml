[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glm52-kernel-lab"
version = "0.1.0"
description = "GLM5.2 decode per-kernel check/bench/compare harness (Blackwell-only)"
requires-python = ">=3.11"
# torch is an OPTIONAL runtime dependency, imported lazily and only on the
# check/bench/compare paths — list / pytest / manifest handling run on a
# torch-less CPU box. No hard dependencies on purpose.
dependencies = []

[project.scripts]
kernel_lab = "kernel_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["kernel_lab*"]
