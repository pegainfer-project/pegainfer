unit = "fp8_gemm.shared_down"
# GEMM leg of the shared-expert SwiGLU down projection ([6144, 2048]).
phase = 1
symbol = "glm52_fp8_groupwise_gemm_sm100_cuda"
adapter = "fp8_gemm_groupwise"
capability = { blackwell_only = true }
scratch = "32 MiB CUTLASS grouped-scheduler/tensormap workspace carved inside the FFI (fp8.rs FP8_GEMM_WORKSPACE_BYTES); allocated as bench warmup material, never timed"
[axes]
rows = [4, 8, 16, 32, 48, 64, 96]
[shape]
n = 6144   # hidden 6144
k = 2048   # shared expert intermediate 2048
[contract]
inputs = "act e4m3 [rows, 2048] + act_scales f32 [rows, 16] (refs/quant.fp8_per_token_group_quant_ref, ue8m0 off — the real production silu_out is bf16 re-quantized; the quant chain itself lives in refs/quant.py); weight e4m3 [6144, 2048] + weight_scales f32 [48, 16]; workspace 32 MiB (= fp8.rs FP8_GEMM_WORKSPACE_BYTES)"
outputs = "out[rows, 6144] bf16"
accumulation = "f32 (CUTLASS tcgen05 block-scaled MMA; fixed hardware writeback order)"
notes = "The down half of the shared-expert SwiGLU projection. FFI requires m%4==0 and k%128==0; targets outside the sm_100a family compile to a NOT_SUPPORTED stub."
[reference]
mode = "torch_tolerance"
[reference.tolerance]
rel_l2 = 0.02
note = "Same reference recipe as fp8_gemm.q_b; MEASURED rel_l2 <= 9.1e-5 across the full rows axis (GB300 sm_103 tray03, 2026-08-01)"
