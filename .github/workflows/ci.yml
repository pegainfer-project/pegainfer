name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dco:
    if: github.event_name == 'pull_request'
    name: DCO sign-off
    runs-on: ubuntu-latest

    steps:
      # Plain API check instead of KineticCafe/actions-dco: that action decodes
      # the full commit *comparison*, whose file entries carry
      # `blob_url: null` for submodule bumps, and its strict decoder rejects
      # the whole payload — so any PR touching a submodule can never pass.
      # A DCO check only needs the commit list. Merge commits are skipped, as
      # the DCO app does: GitHub's Update branch button creates them unsigned.
      - name: Check commit sign-offs
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          unsigned=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits?per_page=100" \
            --jq '.[]
                  | select(.parents | length == 1)
                  | select(.commit.message | test("(?m)^Signed-off-by: .+ <.+@.+>") | not)
                  | .sha[0:10] + " " + (.commit.message | split("\n")[0])')
          if [ -n "$unsigned" ]; then
            echo "$unsigned" | while read -r line; do
              echo "::error::no Signed-off-by trailer on commit $line"
            done
            echo '::error::add sign-offs with: git rebase --signoff origin/main'
            exit 1
          fi
          echo "all commits carry a Signed-off-by trailer"

  attribution-script:
    name: Attribution script checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Lint attribution scripts
        run: shellcheck .github/scripts/attribution-notice.sh .github/scripts/attribution-notice-test.sh

      - name: Run attribution behavior tests
        run: bash .github/scripts/attribution-notice-test.sh

  rust-format:
    name: Rust formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

  cargo-metadata:
    name: Locked Cargo metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt, clippy

      - name: Check locked Cargo metadata
        run: cargo metadata --locked --no-deps --format-version 1

  cpu-unit-tests:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    name: CPU unit tests
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: Install protobuf compiler
        id: deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run pegainfer-build unit tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: cargo test --release --locked -p pegainfer-build --lib

      - name: Run pegainfer-frontend unit tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: cargo test --release --locked -p pegainfer-frontend --lib

      - name: Run pegainfer-sim unit tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: cargo test --release --locked -p pegainfer-sim --lib

      - name: Run kvbm-logical unit tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: cargo test --release --locked -p kvbm-logical --lib

  cpu-clippy:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    name: CPU Clippy
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run CPU Clippy
        run: >-
          cargo clippy --release --locked
          -p pegainfer-build
          -p pegainfer-frontend
          -p pegainfer-sim
          -p kvbm-logical
          --all-targets -- -D warnings

  simulated-frontend-e2e:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    name: Simulated frontend E2E
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run simulated frontend E2E tests
        run: cargo test --release --locked -p pegainfer-sim --test frontend_e2e

  cuda-clippy-rows:
    name: Select CUDA Clippy rows
    runs-on: ubuntu-latest
    outputs:
      rows: ${{ steps.select.outputs.rows }}

    steps:
      # A pull request checks out its merge commit, whose first parent is the
      # base branch, so two commits are enough to list the changed files.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2

      # One row per model line; adding a model line is one more row. Clippy
      # lints every target of the packages a row names and the library of each
      # workspace crate they pull in. pegainfer-cupti is out: building it needs
      # CUPTI headers the toolkit omits.
      #
      # `feature` is empty for the default line, which is the only one that
      # needs no `--features` flag. That row also names the shared crates, so
      # their tests are linted once. Each row builds for `cuda_sm`: the Kimi-K2
      # DeepEP shim needs sm_90 and the GLM5.2 kernels need sm_100.
      #
      # A push to main runs every row. A pull request runs the rows its changed
      # files reach: a model crate reaches its own row; a shared crate, the
      # workspace manifests, the toolchain or this workflow reaches every row;
      # any other file reaches the rows of the crates whose Rust source names
      # it, as `include_str!` does.
      - name: Select rows
        id: select
        env:
          ROWS: |
            [
              {"key": "qwen3", "model_name": "Qwen3", "package": "pegainfer-qwen3",
               "extra_packages": "-p pegainfer-server -p pegainfer-core -p pegainfer-kernels -p pegainfer-kv-cache -p pegainfer-kv-offload -p pegainfer-kv-store -p pegainfer-sample -p pegainfer-bench",
               "feature": "", "cuda_sm": "80", "needs_triton": false, "triton_python": "", "needs_nccl": false},
              {"key": "gemma4", "model_name": "Gemma 4", "package": "pegainfer-gemma4",
               "extra_packages": "", "feature": "gemma4", "cuda_sm": "80",
               "needs_triton": false, "triton_python": "", "needs_nccl": false},
              {"key": "qwen35", "model_name": "Qwen3.5", "package": "pegainfer-qwen35",
               "extra_packages": "", "feature": "qwen35", "cuda_sm": "80",
               "needs_triton": true, "triton_python": "python", "needs_nccl": false},
              {"key": "k3", "model_name": "Kimi-K3", "package": "pegainfer-k3",
               "extra_packages": "-p pegainfer-kernels", "feature": "k3", "cuda_sm": "80",
               "needs_triton": false, "triton_python": "", "needs_nccl": false},
              {"key": "glm52", "model_name": "GLM5.2", "package": "pegainfer-glm52",
               "extra_packages": "-p pegainfer-kernels", "feature": "glm52", "cuda_sm": "100",
               "needs_triton": false, "triton_python": "", "needs_nccl": true},
              {"key": "kimi-k2", "model_name": "Kimi-K2", "package": "pegainfer-kimi-k2",
               "extra_packages": "-p pegainfer-kernels", "feature": "kimi-k2", "cuda_sm": "90",
               "needs_triton": false, "triton_python": "", "needs_nccl": true},
              {"key": "deepseek-v2-lite", "model_name": "DeepSeek-V2-Lite", "package": "pegainfer-deepseek-v2-lite",
               "extra_packages": "-p pegainfer-kernels", "feature": "deepseek-v2-lite", "cuda_sm": "80",
               "needs_triton": false, "triton_python": "", "needs_nccl": false},
              {"key": "qwen4", "model_name": "Qwen4", "package": "pegainfer-qwen4",
               "extra_packages": "-p pegainfer-kernels", "feature": "pegainfer-kernels/qwen4", "cuda_sm": "80",
               "needs_triton": false, "triton_python": "", "needs_nccl": false}
            ]
        run: |
          set -euo pipefail
          rows_for_crate() {
            case "$1" in
              pegainfer-qwen3 | pegainfer-server | pegainfer-cupti) echo qwen3 ;;
              pegainfer-gemma4) echo gemma4 ;;
              pegainfer-qwen35) echo qwen35 ;;
              pegainfer-k3) echo k3 ;;
              pegainfer-glm52) echo glm52 ;;
              pegainfer-kimi-k2) echo kimi-k2 ;;
              pegainfer-deepseek-v2-lite) echo deepseek-v2-lite ;;
              pegainfer-qwen4) echo qwen4 ;;
              pegainfer-sim) ;;
              *) echo all ;;
            esac
          }
          rows_for_path() {
            case "$1" in
              Cargo.toml | Cargo.lock | rust-toolchain.toml | .github/workflows/ci.yml) echo all ;;
              pegainfer-*/* | kvbm/*) rows_for_crate "${1%%/*}" ;;
            esac
            if [[ $1 != *.rs ]]; then
              { git grep -l -F -- "${1##*/}" -- '*.rs' || true; } | while read -r file; do
                rows_for_crate "${file%%/*}"
              done
            fi
          }
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            keys=$(git diff --name-only HEAD^1 HEAD | while read -r path; do rows_for_path "$path"; done | sort -u)
          else
            keys=all
          fi
          selected=$(jq -c --arg keys "$keys" \
            '($keys | split("\n")) as $k | map(select(($k | index("all")) or (.key as $key | $k | index($key))))' \
            <<<"$ROWS")
          echo "rows reached: $(jq -r 'map(.key) | join(" ")' <<<"$selected")"
          echo "rows=$selected" >> "$GITHUB_OUTPUT"

  feature-model-cuda:
    needs: cuda-clippy-rows
    if: >-
      (github.event_name == 'push' || github.event.pull_request.draft == false)
      && needs.cuda-clippy-rows.outputs.rows != '[]'
    name: ${{ matrix.model_name }} CUDA Clippy (sm_${{ matrix.cuda_sm }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CUDA_PATH: /usr/local/cuda
      PEGAINFER_CUDA_SM: ${{ matrix.cuda_sm }}
      PEGAINFER_NVCC_JOBS: "2"
      PEGAINFER_NVCC_LAUNCHER: sccache
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.cuda-clippy-rows.outputs.rows) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "13.0.2"
          linux-local-args: '["--toolkit"]'
          method: network
          sub-packages: '["nvcc", "nvrtc-dev", "cudart-dev"]'
          non-cuda-sub-packages: '["libcublas-dev", "libcurand-dev"]'

      - name: Install Python
        if: matrix.needs_triton
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libibverbs-dev

      - name: Install Triton
        if: matrix.needs_triton
        run: python -m pip install "triton==3.7.1"

      # The DeepEP shim behind the kernels' `moe` feature links NCCL >= 2.30.4;
      # build.rs takes the unpacked nvidia-nccl-cu13 wheel as its root.
      - name: Install NCCL
        if: matrix.needs_nccl
        run: |
          python3 -m pip download "nvidia-nccl-cu13==2.30.7" --no-deps --only-binary=:all: -d "$RUNNER_TEMP/nccl"
          unzip -q "$RUNNER_TEMP"/nccl/*.whl 'nvidia/nccl/*' -d "$RUNNER_TEMP/nccl"
          echo "PEGAINFER_NCCL_ROOT=$RUNNER_TEMP/nccl/nvidia/nccl" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.model_name }} CUDA Clippy
        run: >-
          cargo clippy --release --locked
          -p ${{ matrix.package }} ${{ matrix.extra_packages }}
          ${{ matrix.feature && format('--features {0}', matrix.feature) }}
          --all-targets -- -D warnings
        env:
          PEGAINFER_TRITON_PYTHON: ${{ matrix.triton_python }}
