# SECURITY: pull_request_target gives fork PRs a write token, so never check out or run PR code.

name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

concurrency:
  # An edit that leaves the title alone skips every job, so it gets a group of its
  # own and cannot cancel the run for a push.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && !github.event.changes.title && github.run_id || 'label' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label by path and title
    if: >-
      ${{ !contains(github.event.pull_request.labels.*.name, 'stale')
      && (github.event.action != 'edited' || github.event.changes.title) }}
    runs-on: ubuntu-latest

    steps:
      - name: Label by changed paths
        uses: actions/labeler@v7.0.0

      - name: Label by Commitizen type
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          title=$(gh pr view "$PR_NUMBER" -R "$REPO" --json title --jq .title)
          labels=$(gh pr view "$PR_NUMBER" -R "$REPO" --json labels --jq '.labels[].name')
          case "$title" in
            fix\(*|fix:*|fix!*) add=bug remove=enhancement ;;
            feat\(*|feat:*|feat!*) add=enhancement remove=bug ;;
            *) exit 0 ;;
          esac
          args=(--add-label "$add")
          if grep -qx "$remove" <<<"$labels"; then
            args+=(--remove-label "$remove")
          fi
          gh pr edit "$PR_NUMBER" -R "$REPO" "${args[@]}"

  needs-rebase:
    name: Sync the needs-rebase label
    needs: label
    # After the labeler, which writes back the whole label set it read and would
    # undo a needs-rebase change made in between.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/needs-rebase.yml
    with:
      pr: ${{ github.event.pull_request.number }}
