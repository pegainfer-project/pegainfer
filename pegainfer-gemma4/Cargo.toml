[package]
autobenches = false
autobins = false
edition = "2024"
license = "Apache-2.0"
name = "pegainfer-gemma4"
version = "0.1.0"

[features]
gemma4 = [
  "dep:cudarc",
  "dep:half",
  "dep:log",
  "dep:pegainfer-core",
  "dep:pegainfer-kernels",
  "dep:pegainfer-sample",
]
default = []

[dependencies]
anyhow = { workspace = true }
cudarc = { workspace = true, optional = true }
half = { workspace = true, optional = true }
log = { workspace = true, optional = true }
pegainfer-core = { workspace = true, optional = true }
pegainfer-frontend = { workspace = true }
pegainfer-kernels = { workspace = true, features = ["gemma4"], optional = true }
pegainfer-sample = { workspace = true, optional = true }
safetensors = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
