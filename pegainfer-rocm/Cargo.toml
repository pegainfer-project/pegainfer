[package]
name = "pegainfer-rocm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Every target needs the ROCm SDK, so without this feature the crate is empty and
# a workspace build never reaches hipcc.
[features]
default = []
rocm = []

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
half = { workspace = true }
log = { workspace = true }
memmap2 = { workspace = true }
pegainfer-frontend = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[build-dependencies]
pegainfer-build = { workspace = true }

[[test]]
name = "contract"
required-features = ["rocm"]

[[test]]
name = "golden"
required-features = ["rocm"]

[lints]
workspace = true
