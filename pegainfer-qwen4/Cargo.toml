[package]
autobenches = false
autobins = false
edition = "2024"
license = "Apache-2.0"
name = "pegainfer-qwen4"
version = "0.1.0"

[features]
default = []
qwen4 = [
  "dep:cudarc",
  "dep:half",
  "dep:log",
  "dep:memmap2",
  "dep:pegainfer-core",
  "dep:pegainfer-kernels",
  "dep:pegainfer-sample",
]

[dependencies]
anyhow = { workspace = true }
cudarc = { workspace = true, optional = true }
half = { workspace = true, optional = true }
log = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
pegainfer-core = { workspace = true, optional = true }
pegainfer-frontend = { workspace = true }
# `qwen35` for the Gated DeltaNet conv and delta rule wrappers this line shares.
pegainfer-kernels = { workspace = true, features = ["qwen4", "qwen35"], optional = true }
pegainfer-sample = { workspace = true, optional = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
